async function restoreBackup(evt){
  const file = evt.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data.students || !Array.isArray(data.students)) throw new Error('format tidak valid');
    const ok = await confirmModal('Pulihkan Cadangan', `Berkas berisi ${data.students.length} siswa. Data ini akan digabung dengan data yang sudah ada (siswa dengan Nomor Induk sama akan ditimpa). Lanjutkan?`, 'Pulihkan');
    if(!ok) return;
    for(const s of data.students){
      const idx = DB.students.findIndex(x=>x.induk===s.induk);
      if(idx>=0) DB.students[idx]=s; else DB.students.push(s);
    }
    await saveStudents();
    for(const induk of Object.keys(data.layanan||{})){
      DB.layanan[induk] = data.layanan[induk];
      await saveLayanan(induk);
    }
    for(const induk of Object.keys(data.kasus||{})){
      DB.kasus[induk] = data.kasus[induk];
      await saveKasus(induk);
    }
    for(const kelas of Object.keys(data.klasikal||{})){
      DB.klasikal[kelas] = data.klasikal[kelas];
      await saveKlasikal(kelas);
    }
    if(Array.isArray(data.administrasi)){
      DB.administrasi = data.administrasi;
      await saveAdministrasi();
    }
    if(Array.isArray(data.wawancaraWali)){
      DB.wawancaraWali = data.wawancaraWali;
      await saveWawancaraWali();
    }
    if(Array.isArray(data.upgrading)){
      DB.upgrading = data.upgrading;
      await saveUpgrading();
    }
    if(Array.isArray(data.homeVisit)){
      DB.homeVisit = data.homeVisit;
      await saveHomeVisit();
    }
    if(Array.isArray(data.personalBK)){
      DB.personalBK = data.personalBK;
      await savePersonalBK();
    }
    toast('Cadangan berhasil dipulihkan');
    render();
  }catch(e){
    toast('Gagal memulihkan cadangan: berkas tidak valid', true);
  }
  evt.target.value='';
}

/* ================== EKSPOR: EXCEL & PDF ================== */
function collectLayananRows(induk){
  // returns [{induk,nama,kelas,tgl,jenis,guru,hasil,anggota}], filtered by jenis filter relevant to context
  const jenisFilter = induk ? STATE.layananFilterJenis : STATE.laporanJenisLayanan;
  const scopeStudents = induk ? [findStudent(induk)] : DB.students.filter(s => STATE.laporanKelas ? s.kelas===STATE.laporanKelas : assignedKelasList().includes(s.kelas));
  let rows = [];
  scopeStudents.forEach(s=>{
    if(!s) return;
    (DB.layanan[s.induk]||[]).forEach(r=>{
      if(jenisFilter && r.jenis!==jenisFilter) return;
      if(!induk && !inLaporanDateRange(r.tgl)) return;
      const anggota = r.kelompokId ? (r.anggotaKelompok||[]).map(m=>m.nama).join(', ') : '';
      rows.push({induk:s.induk, nama:s.nama, kelas:s.kelas, tgl:r.tgl, jenis:r.jenis, bidang:r.bidang||'', guru:r.guru, hasil:r.hasil, anggota});
    });
  });
  rows.sort((a,b)=> a.kelas.localeCompare(b.kelas) || a.nama.localeCompare(b.nama) || (a.tgl||'').localeCompare(b.tgl||''));
  return {rows, jenisFilter};
}
function collectKasusRows(induk){
  const jenisFilter = induk ? STATE.kasusFilterJenis : STATE.laporanJenisKasus;
  const scopeStudents = induk ? [findStudent(induk)] : DB.students.filter(s => STATE.laporanKelas ? s.kelas===STATE.laporanKelas : assignedKelasList().includes(s.kelas));
  let rows = [];
  scopeStudents.forEach(s=>{
    if(!s) return;
    (DB.kasus[s.induk]||[]).forEach(r=>{
      if(jenisFilter && r.namaKasus!==jenisFilter) return;
      if(!induk && !inLaporanDateRange(r.tgl)) return;
      rows.push({induk:s.induk, nama:s.nama, kelas:s.kelas, tgl:r.tgl, namaKasus:r.namaKasus, bidang:r.bidang||'', kronologis:r.kronologis, penanganan:r.penanganan, kolaborasi:r.kolaborasi});
    });
  });
  rows.sort((a,b)=> a.kelas.localeCompare(b.kelas) || a.nama.localeCompare(b.nama) || (a.tgl||'').localeCompare(b.tgl||''));
  return {rows, jenisFilter};
}

function pdfHeader(doc, title, subtitle){

  doc.setFont('helvetica','bold');
  doc.setFontSize(14);
  doc.setTextColor(10,46,42);
  doc.text(title, pageWidth/2, 64, {align:'center'});
  doc.setFontSize(10.5);
  doc.setTextColor(138,106,36);
  doc.text(subtitle, pageWidth/2, 80, {align:'center'});
  doc.setDrawColor(200,200,200);
  doc.line(40, 90, pageWidth-40, 90);
  return 100;
}

function collectKlasikalRows(source){
  const kelasFilter = source==='laporan' ? STATE.laporanKelas : STATE.klasikalFilterKelas;
  const scope = kelasFilter ? [kelasFilter] : assignedKelasList();
  let rows = [];
  scope.forEach(k=>{
    (DB.klasikal[k]||[]).forEach(r=>{
      if(source==='laporan' && !inLaporanDateRange(r.tgl)) return;
      rows.push({kelas:k, tgl:r.tgl, jamKe:r.jamKe, pertemuanKe:r.pertemuanKe, materi:r.materi, guru:r.guru});
    });
  });
  rows.sort((a,b)=> a.kelas.localeCompare(b.kelas) || (a.tgl||'').localeCompare(b.tgl||''));
  return {rows, kelasFilter};
}

function toggleGasPanel(show){
  STATE.showGasPanel = show;
  render();
}
async function testGasConnection(){
  const input = document.getElementById('gasUrlInput');
  const url = input.value.trim();
  if(!url){ toast('Isi URL Web App terlebih dahulu', true); return; }
  try{
    const res = await fetch(url + '?action=list&prefix=__ping__');
    if(!res.ok) throw new Error('status ' + res.status);
    const data = await res.json();
    if(data && Array.isArray(data.keys)){
      toast('Koneksi berhasil! Google Sheets siap dipakai.');
    } else {
      toast('Respons tidak dikenali. Periksa kembali kode Apps Script Anda.', true);
    }
  }catch(e){
    toast('Gagal terhubung: periksa URL atau pengaturan deployment (Access: Anyone)', true);
  }
}

function saveGasUrlAndDownload(){
  const input = document.getElementById('gasUrlInput');
  const url = input.value.trim();
  const fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  const escapedUrl = url.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  const newHtml = fullHtml.replace(/const GAS_URL = '.*?';/, `const GAS_URL = '${escapedUrl}';`);
  const blob = new Blob([newHtml], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Layanan_BK_SMP_Al_Hikmah_Surabaya.html';
  document.body.appendChild(a); a.click(); a.remove();
  toast(url ? 'Berkas baru dengan koneksi Google Sheets sudah diunduh. Gunakan berkas ini mulai sekarang.' : 'Berkas baru (tanpa Google Sheets) sudah diunduh.');
}

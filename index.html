<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layanan Bimbingan Konseling — SMP Al Hikmah Full Day School Surabaya</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --teal-950:#0a2e2a;
  --teal-900:#0d3b36;
  --teal-800:#124c45;
  --teal-700:#186158;
  --teal-100:#e4efec;
  --teal-50:#f3f8f6;
  --gold-700:#8a6a24;
  --gold-600:#a97d2f;
  --gold-500:#c79a41;
  --gold-100:#f6ecd6;
  --ink:#1c2422;
  --ink-soft:#4b5b57;
  --line:#dbe4e1;
  --white:#ffffff;
  --danger:#a83232;
  --danger-bg:#fbeaea;
  --ok:#1e6b52;
  --radius:10px;
  --shadow:0 1px 2px rgba(10,46,42,.06), 0 4px 16px rgba(10,46,42,.06);
  --font-display:'Fraunces','Georgia',serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  color:var(--ink);
  background:linear-gradient(180deg,var(--teal-50) 0%, #ecf3f1 100%);
  min-height:100vh;
}
::selection{background:var(--gold-100);}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ---------- Header ---------- */
.topbar{
  background:linear-gradient(120deg,var(--teal-950),var(--teal-800));
  color:var(--white);
  padding:14px 22px;
  display:flex;align-items:center;gap:14px;
  position:sticky;top:0;z-index:50;
  box-shadow:0 2px 14px rgba(0,0,0,.18);
}
.topbar img{height:44px;width:44px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25));}
.topbar .brand-text{line-height:1.25;}
.topbar .brand-text .t1{font-family:var(--font-display);font-weight:600;font-size:16.5px;letter-spacing:.2px;}
.topbar .brand-text .t2{font-size:11.5px;color:var(--gold-100);opacity:.85;letter-spacing:.4px;text-transform:uppercase;}
.topbar nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;}
.topbar nav button{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);
  color:var(--white);
  padding:8px 14px;border-radius:999px;font-size:13px;font-weight:500;
  transition:background .15s;
}
.topbar nav button:hover{background:rgba(255,255,255,.18);}
.topbar nav button.active{background:var(--gold-600);border-color:var(--gold-600);color:var(--teal-950);font-weight:700;}
.topbar nav button.nav-locked{opacity:.4;}
.topbar nav button.nav-locked:hover{background:rgba(255,255,255,.08);}

/* ---------- Layout ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:26px 20px 70px;}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.pagehead h1{font-family:var(--font-display);font-size:26px;margin:0 0 4px;color:var(--teal-950);}
.pagehead p{margin:0;color:var(--ink-soft);font-size:13.5px;}
.crumbs{font-size:12.5px;color:var(--gold-700);font-weight:600;letter-spacing:.3px;text-transform:uppercase;margin-bottom:6px;}

.card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px;
  margin-bottom:18px;
}
.card h2{font-family:var(--font-display);font-size:18px;margin:0 0 14px;color:var(--teal-900);display:flex;align-items:center;gap:8px;}
.card h2 .num{
  width:24px;height:24px;border-radius:50%;background:var(--teal-900);color:var(--white);
  display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-family:var(--font-body);font-weight:700;
}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
@media (max-width:680px){.grid2,.grid3{grid-template-columns:1fr;}}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:12.5px;font-weight:600;color:var(--teal-900);letter-spacing:.15px;}
.field .hint{font-size:11.5px;color:var(--ink-soft);font-weight:400;margin-top:-3px;}
.field input,.field select,.field textarea{
  border:1.5px solid var(--line);
  border-radius:8px;
  padding:9px 11px;
  font-size:14px;
  color:var(--ink);
  background:var(--white);
  outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--teal-700);
  box-shadow:0 0 0 3px rgba(24,97,88,.12);
}
.field textarea{resize:vertical;min-height:78px;line-height:1.5;}

.btn{
  border:none;border-radius:8px;padding:10px 18px;font-size:13.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;transition:transform .08s, box-shadow .15s, background .15s;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--teal-900);color:var(--white);}
.btn-primary:hover{background:var(--teal-800);}
.btn-gold{background:var(--gold-600);color:var(--teal-950);}
.btn-gold:hover{background:var(--gold-500);}
.btn-outline{background:var(--white);color:var(--teal-900);border:1.5px solid var(--teal-900);}
.btn-outline:hover{background:var(--teal-100);}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1.5px solid #eecccc;}
.btn-danger:hover{background:#f6d9d9;}
.btn-ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);}
.btn-ghost:hover{background:var(--teal-50);}
.btn-sm{padding:6px 12px;font-size:12.5px;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}

.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.2px;}
.pill-teal{background:var(--teal-100);color:var(--teal-900);}
.pill-gold{background:var(--gold-100);color:var(--gold-700);}
.pill-danger{background:var(--danger-bg);color:var(--danger);}

.searchbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.searchbar input,.searchbar select{
  border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13.5px;
}
.searchbar input{flex:1;min-width:180px;}

table.list{width:100%;border-collapse:collapse;font-size:13.5px;}
table.list th{
  text-align:left;padding:10px 10px;background:var(--teal-50);color:var(--teal-900);
  font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid var(--line);
}
table.list td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
table.list tr:hover td{background:#fbfbf9;}
table.list .namecell{font-weight:600;color:var(--teal-950);}
table.list .rowactions{display:flex;gap:6px;flex-wrap:wrap;}

.empty{
  text-align:center;padding:38px 20px;color:var(--ink-soft);
  border:1.5px dashed var(--line);border-radius:10px;background:var(--teal-50);
}
.empty .big{font-size:15px;font-weight:600;color:var(--teal-900);margin-bottom:4px;}

.studenthead{
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  background:linear-gradient(120deg,var(--teal-950),var(--teal-700));
  color:var(--white);border-radius:var(--radius);padding:18px 22px;margin-bottom:18px;
}
.studenthead .who .nm{font-family:var(--font-display);font-size:20px;font-weight:600;}
.studenthead .who .meta{font-size:12.5px;color:var(--gold-100);opacity:.9;margin-top:3px;}
.studenthead .tabs{display:flex;gap:8px;flex-wrap:wrap;}
.studenthead .tabs button{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:var(--white);
  padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:600;
}
.studenthead .tabs button.active{background:var(--gold-600);color:var(--teal-950);border-color:var(--gold-600);}

.record{
  border:1px solid var(--line);border-radius:9px;padding:14px 16px;margin-bottom:10px;background:var(--white);
}
.record .rtop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px;}
.record .rtop .tag{font-weight:700;color:var(--teal-900);font-size:13.5px;}
.record .rdate{font-size:12px;color:var(--ink-soft);}
.record .rbody{font-size:13.5px;line-height:1.55;color:var(--ink);white-space:pre-wrap;}
.record .rmeta{margin-top:8px;font-size:12px;color:var(--ink-soft);display:flex;gap:14px;flex-wrap:wrap;}
.record .ractions{margin-top:10px;display:flex;gap:8px;}

.warnbox{
  background:#fff6e6;border:1.5px solid var(--gold-500);border-radius:9px;padding:14px 16px;margin-bottom:16px;
}
.warnbox .wtitle{font-weight:700;color:var(--gold-700);font-size:13.5px;margin-bottom:6px;display:flex;gap:7px;align-items:center;}
.warnbox .wbody{font-size:13px;color:#5c4813;line-height:1.55;}
.warnbox ul{margin:6px 0 0;padding-left:18px;}

.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:var(--teal-950);color:var(--white);padding:12px 20px;border-radius:999px;
  font-size:13.5px;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:200;
  display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
.toast.danger{background:var(--danger);}

.modal-bg{
  position:fixed;inset:0;background:rgba(10,20,18,.55);display:flex;align-items:center;justify-content:center;
  z-index:300;padding:20px;
}
.modal{
  background:var(--white);border-radius:12px;max-width:440px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.modal h3{margin:0 0 10px;font-family:var(--font-display);color:var(--teal-950);font-size:18px;}
.modal p{font-size:13.5px;color:var(--ink-soft);line-height:1.55;margin:0 0 16px;}
.modal .btnrow{justify-content:flex-end;}

.footer-note{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:30px;opacity:.8;}

.journalhead{
  text-align:center;
  padding:8px 10px 26px;
  margin-bottom:6px;
}
.journalhead .jtitle{
  font-family:var(--font-display);
  font-weight:700;
  font-size:34px;
  color:var(--teal-950);
  letter-spacing:.2px;
}
.journalhead .jtitle::after{
  content:'';
  display:block;
  width:64px;height:3px;
  background:var(--gold-600);
  margin:10px auto 16px;
  border-radius:2px;
}
.journalhead .jsub{
  display:inline-flex;
  align-items:center;
  gap:10px;
  font-size:14px;
  font-weight:600;
  color:var(--teal-900);
}
.journalhead .jsub select{
  border:1.5px solid var(--gold-500);
  background:var(--gold-100);
  color:var(--teal-950);
  font-weight:700;
  border-radius:999px;
  padding:6px 14px;
  font-size:14px;
  outline:none;
  cursor:pointer;
}
.journalhead .jsub select:focus{box-shadow:0 0 0 3px rgba(199,154,65,.25);}
@media (max-width:520px){
  .journalhead .jtitle{font-size:26px;}
}

/* Print-only report container, hidden on screen */
#printRoot{display:none;}
@media print{
  body *{visibility:hidden;}
  #printRoot, #printRoot *{visibility:visible;}
  #printRoot{display:block;position:absolute;top:0;left:0;width:100%;padding:0;margin:0;}
  .topbar,.wrap>*:not(#printRoot){display:none !important;}
}
.rprint-header{text-align:center;margin-bottom:18px;}
.rprint-header img{height:56px;margin-bottom:8px;}
.rprint-header h1{font-family:var(--font-display);font-size:19px;margin:0 0 2px;color:var(--teal-950);}
.rprint-header h2{font-size:13px;margin:0;color:var(--gold-700);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
.rprint-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:14px;}
.rprint-table th,.rprint-table td{border:1px solid #999;padding:6px 8px;text-align:left;vertical-align:top;}
.rprint-table th{background:#eee;}

@media (max-width:520px){
  .topbar{padding:12px 14px;}
  .topbar .brand-text .t1{font-size:14px;}
  .topbar .brand-text .t2{font-size:10px;}
  .wrap{padding:18px 12px 60px;}
  .pagehead h1{font-size:21px;}
}
</style>
</head>
<body>

<div class="topbar">
  <img id="logoTop" src="" alt="Logo BK">
  <div class="brand-text">
    <div class="t1">Bimbingan Konseling</div>
    <div class="t2">SMP Al Hikmah Full Day School Surabaya</div>
  </div>
  <span id="activePersonalBadge" class="pill pill-gold" style="margin-left:16px;display:none;"></span>
  <nav>
    <button data-nav="personalbk">Personal BK</button>
    <button data-nav="beranda" class="active">Beranda</button>
    <button data-nav="administrasi">Layanan Administrasi BK</button>
    <button data-nav="upgrading">Upgrading Personal BK</button>
    <button data-nav="laporan">Laporan Semua Kelas</button>
    <button data-nav="kelola">Kelola Data</button>
    <button data-nav="analisis">Analisis Data Jurnal Konselor</button>
    <button data-nav="pengontrol" id="navPengontrol">Pengontrol Sistem Kata Sandi</button>
  </nav>
</div>

<div class="wrap" id="app"></div>

<div id="printRoot"></div>

<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script id="app-script">
/* ================== KONSTANTA ================== */
const KELAS_LIST = [];
['7','8','9'].forEach(g => 'ABCDEFGHIJ'.split('').forEach(l => KELAS_LIST.push(g+l)));

const LAYANAN_OPTIONS = [
  'Konseling Individu',
  'Konsultasi Wali Murid','Koordinasi dengan Wali Kelas','Koordinasi dengan Managemen','Lainnya'
];

const KASUS_OPTIONS = [
  'Perundungan verbal','Perundungan fisik','Perundungan Cyber','Perundungan Pelecehan seksual',
  'Perundungan Nonverbal','Vandalisme','Keterlambatan','Hubungan dengan lawan jenis','Pornografi',
  'Perkelahian','Membawa Hp tanpa ijin','Membawa benda tajam','Merokok','Lainnya'
];

const BIDANG_BK_OPTIONS = ['Bidang Pribadi','Bidang Sosial','Bidang Belajar','Bidang Karir'];

/* Struktur Layanan Administrasi BK: 3 bagian tercentang + 1 bagian keterangan bebas */
const ADMINISTRASI_CATEGORIES = [
  { key:'penyusunan', label:'1. Penyusunan Program', items:[
      { key:'tahunan', label:'Membuat Perencanaan Tahunan' },
      { key:'semesteran', label:'Membuat Perencanaan Semesteran' },
      { key:'rpl', label:'RPL (Rencana Pelaksanaan Layanan)', hasKet:true }
  ]},
  { key:'pencatatan', label:'2. Pencatatan Data', items:[
      { key:'jurnal', label:'Mengisi Jurnal BK' },
      { key:'psikotes', label:'Himpunan Data Psikotest' },
      { key:'nonpsikologi', label:'Himpunan Data Non Psikologi (Angket/Skala/Kuesioner)' },
      { key:'konseling', label:'Himpunan Data Konseling' }
  ]},
  { key:'pelaporan', label:'3. Pelaporan dan Evaluasi', items:[
      { key:'kinerja', label:'Membuat Laporan Kinerja', hasKet:true },
      { key:'evaluasi', label:'Evaluasi Program Layanan BK', hasKet:true }
  ]},
  { key:'lainnya', label:'4. Lainnya', items:[
      { key:'lainnya', label:'Lainnya', hasKet:true, required:true }
  ]}
];

/* Jenis kegiatan Upgrading Personal BK, lengkap dengan definisi singkat */
const UPGRADING_JENIS_LIST = [
  { key:'Webinar', def:'Seminar atau pelatihan yang diselenggarakan secara daring (online) melalui platform video conference.' },
  { key:'Seminar', def:'Pertemuan untuk membahas suatu topik bersama narasumber, biasanya disertai sesi tanya jawab.' },
  { key:'Workshop', def:'Kegiatan pelatihan dengan praktik langsung (hands-on) untuk mengasah keterampilan tertentu.' },
  { key:'Pelatihan', def:'Kegiatan terstruktur yang bertujuan meningkatkan pengetahuan dan keterampilan peserta.' },
  { key:'Bimtek', def:'Bimbingan Teknis: pembinaan praktis untuk meningkatkan kompetensi di bidang tertentu.' }
];

/* Tugas Jenjang Kelas untuk halaman Personal BK: dikelompokkan per jenjang (7/8/9) saja,
   masing-masing berisi checklist kelas spesifik A-J sesuai jenjangnya */
const TUGAS_JENJANG_LIST = [
  { key:'k7', label:'Kelas 7', grade:'7' },
  { key:'k8', label:'Kelas 8', grade:'8' },
  { key:'k9', label:'Kelas 9', grade:'9' }
];
function kelasForGrade(grade){ return KELAS_LIST.filter(k=>k.startsWith(grade)); }

const DEFAULT_PERSONAL_BK = [
  'Erwin Kohar Ferdihananto, M.Psi',
  'Jibrel Attar, S.Psi',
  'Kharis Swara, S.Psi',
  'Leny Arianti, S.Psi',
  'Risma Nur Avita, S.Psi',
  'Rullyasari Fahmi Idris, S.Psi'
].map((nama, i) => ({ id: 'pbk_seed_' + (i+1), nama, kelasTugas: [], jumlahSiswaKelas: {} }));

// Tempel di sini URL Web App Google Apps Script Anda (lihat panduan) untuk menyimpan data ke Google Sheets.

async function gasRequest(method, query, body){
  const url = GAS_URL + (query ? ('?' + query) : '');
  const opts = { method };
  if(body !== undefined){
    opts.headers = {'Content-Type':'text/plain;charset=utf-8'};
    opts.body = JSON.stringify(body);
  }
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), 8000);
  opts.signal = controller.signal;
  try{
    const res = await fetch(url, opts);
    if(!res.ok) throw new Error('Permintaan Google Sheets gagal: ' + res.status);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}
async function sGet(key){
  if(GAS_URL){
    try{
      const data = await gasRequest('GET', 'action=get&key=' + encodeURIComponent(key));
      if(data && data.value !== null && data.value !== undefined && data.value !== ''){
        return JSON.parse(data.value);
      }
      return null;
    }catch(e){ console.error('GS get failed', key, e); return null; }
  }
  try{ const r = await window.storage.get(key,false); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function sSet(key, val){
  if(GAS_URL){
    try{
      await gasRequest('POST', null, {action:'set', key, value: JSON.stringify(val)});
      return true;
    }catch(e){ console.error('GS set failed', key, e); return false; }
  }
  try{ await window.storage.set(key, JSON.stringify(val), false); return true; }
  catch(e){ console.error('storage set failed', key, e); return false; }
}
async function sDel(key){
  if(GAS_URL){
    try{ await gasRequest('POST', null, {action:'delete', key}); return true; }
    catch(e){ return false; }
  }
  try{ await window.storage.delete(key,false); return true; }
  catch(e){ return false; }
}
async function sListKeys(prefix){
  if(GAS_URL){
    try{
      const data = await gasRequest('GET', 'action=list&prefix=' + encodeURIComponent(prefix||''));
      return data && data.keys ? data.keys : [];
    }catch(e){ return []; }
  }
  try{ const r = await window.storage.list(prefix,false); return r ? r.keys : []; }
  catch(e){ return []; }
}

async function loadPersonalBK(force){
  if(force || DB.personalBK === null){
    const stored = await sGet('personal_bk');
    if(stored && Array.isArray(stored) && stored.length){
      DB.personalBK = stored;
    } else {
      DB.personalBK = DEFAULT_PERSONAL_BK.map(p => ({ id:p.id, nama:p.nama, kelasTugas:[], jumlahSiswaKelas:{}, passwordHash:'' }));
      await savePersonalBK();
    }
    // Migrasi format lama (tugas dikelompokkan per jenjang+putra/putri) ke array kelasTugas datar
    let migrated = false;
    DB.personalBK.forEach(p=>{
      if(!Array.isArray(p.kelasTugas)){
        if(p.tugas && typeof p.tugas === 'object'){
          p.kelasTugas = [...new Set(Object.values(p.tugas).flat())];
        } else {
          p.kelasTugas = [];
        }
        delete p.tugas;
        migrated = true;
      }
      if(!p.jumlahSiswaKelas || typeof p.jumlahSiswaKelas !== 'object'){
        p.jumlahSiswaKelas = {};
        migrated = true;
      }
      if(p.passwordHash === undefined){
        p.passwordHash = '';
        migrated = true;
      }
    });
    if(migrated) await savePersonalBK();
  }
  return DB.personalBK;
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function fmtDateID(iso){
  if(!iso) return '-';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'});
}
function fmtDateTimeID(ts){
  if(!ts) return '-';
  const d = new Date(ts);
  if(isNaN(d)) return '-';
  return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}) + ', ' + d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
}
function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function shortText(s,n){ if(!s) return ''; s=String(s); return s.length>n ? s.slice(0,n)+'…' : s; }

function generatePersonalBKMathChallenge(){
  const a = Math.floor(Math.random()*10)+1;
  const b = Math.floor(Math.random()*10)+1;
  STATE.personalBKAuthMathChallenge = { a, b, answer: a+b };
}
function handleSelectPersonalBKClick(id){
  const p = (DB.personalBK||[]).find(x=>x.id===id);
  if(!p) return;
  STATE.personalBKAuthTarget = id;
  const hasTugas = (p.kelasTugas||[]).length > 0;
  STATE.personalBKAuthMode = hasTugas ? (p.passwordHash ? 'login' : 'setup') : 'kelas-setup';
  STATE.personalBKAuthMathChallenge = null;
  render();
}
function proceedToPasswordSetup(id){
  const p = (DB.personalBK||[]).find(x=>x.id===id);
  if(!p) return;
  if(!(p.kelasTugas||[]).length){
    toast('Centang minimal 1 kelas tugas terlebih dahulu', true);
    return;
  }
  STATE.personalBKAuthMode = p.passwordHash ? 'login' : 'setup';
  STATE.personalBKAuthMathChallenge = null;
  render();
}
function cancelPersonalBKAuth(){
  STATE.personalBKAuthTarget = null;
  STATE.personalBKAuthMathChallenge = null;
  render();
}
async function submitPersonalBKSetup(id){
  const pw1 = document.getElementById('pbkAuthPw1').value;
  const pw2 = document.getElementById('pbkAuthPw2').value;
  if(!pw1 || pw1.length<4){ toast('Kata sandi minimal 4 karakter', true); return; }
  if(pw1 !== pw2){ toast('Konfirmasi kata sandi tidak cocok', true); return; }
  const p = (DB.personalBK||[]).find(x=>x.id===id);
  if(!p) return;
  p.passwordHash = simpleHash(pw1);
  await savePersonalBK();
  STATE.personalBKAuthTarget = null;
  STATE.personalBKAuthenticated = true;
  await selectPersonalBK(id);
}
async function submitPersonalBKLogin(id){
  const pw = document.getElementById('pbkAuthPw').value;
  const ans = document.getElementById('pbkAuthMath').value;
  const c = STATE.personalBKAuthMathChallenge;
  const p = (DB.personalBK||[]).find(x=>x.id===id);
  if(!p) return;
  if(!ans || String(ans).trim() !== String(c.answer)){
    toast('Jawaban verifikasi salah, silakan coba lagi', true);
    STATE.personalBKAuthMathChallenge = null;
    render();
    return;
  }
  if(simpleHash(pw) !== p.passwordHash){
    toast('Kata sandi salah', true);
    STATE.personalBKAuthMathChallenge = null;
    render();
    return;
  }
  STATE.personalBKAuthTarget = null;
  STATE.personalBKAuthMathChallenge = null;
  STATE.personalBKAuthenticated = true;
  await selectPersonalBK(id);
}

async function togglePersonalBKKelas(pid, kelas, checked, checkboxEl){
  const p = (DB.personalBK||[]).find(x=>x.id===pid);
  if(!p) return;
  p.kelasTugas = p.kelasTugas || [];
  if(checked){
    if(!p.kelasTugas.includes(kelas)) p.kelasTugas.push(kelas);
  } else {
    const jumlahTerisi = Number((p.jumlahSiswaKelas||{})[kelas]) || 0;
    const adaCatatan = jumlahTerisi > 0;
    const ok = await confirmModal(
      'Hapus Kelas dari Tugas Kinerja',
      `Kelas <b>${esc(kelas)}</b> akan dihapus dari daftar tugas kinerja <b>${esc(p.nama)}</b>${adaCatatan ? ` beserta data jumlah siswa yang sudah diisi (<b>${jumlahTerisi} siswa</b>)` : ''}. Pastikan ini memang bukan kelas tugas Anda sebelum melanjutkan. Lanjutkan menghapus?`,
      'Ya, Hapus', true
    );
    if(!ok){
      if(checkboxEl) checkboxEl.checked = true;
      return;
    }
    p.kelasTugas = p.kelasTugas.filter(k=>k!==kelas);
    if(p.jumlahSiswaKelas) delete p.jumlahSiswaKelas[kelas];
  }
  await savePersonalBK();
  render();
}

/* ---------- INFO GRAFIS PERSONAL BK (Kelola Data) ---------- */
function computePersonalBKAnalysisRow(p){
  const assignedKelas = [...new Set(p.kelasTugas||[])].sort();
  const jsk = p.jumlahSiswaKelas || {};
  let layanan=0, kasus=0, klasikal=0, homeVisit=0;
  let jumlahSiswaTotal=0, siswaTerlayaniTotal=0;
  const kelasBreakdown = [];
  const bidangFreq = {}; BIDANG_BK_OPTIONS.forEach(b=>bidangFreq[b]=0);
  assignedKelas.forEach(kelas=>{
    const studentsInKelas = DB.students.filter(s=>s.kelas===kelas);
    let kelasLayanan=0, kelasKasus=0, siswaTerlayaniKelas=0;
    studentsInKelas.forEach(s=>{
      const jl = (DB.layanan[s.induk]||[]).length;
      const jk = (DB.kasus[s.induk]||[]).length;
      layanan += jl; kasus += jk;
      kelasLayanan += jl; kelasKasus += jk;
      if(jl>0) siswaTerlayaniKelas++;
      (DB.layanan[s.induk]||[]).forEach(r=>{ if(r.bidang && bidangFreq[r.bidang]!==undefined) bidangFreq[r.bidang]++; });
      (DB.kasus[s.induk]||[]).forEach(r=>{ if(r.bidang && bidangFreq[r.bidang]!==undefined) bidangFreq[r.bidang]++; });
    });
    klasikal += (DB.klasikal[kelas]||[]).length;
    homeVisit += (DB.homeVisit||[]).filter(r=>r.kelas===kelas).length;

    const jumlahDiKelas = Number(jsk[kelas]) || 0;
    if(jumlahDiKelas > 0){
      jumlahSiswaTotal += jumlahDiKelas;
      siswaTerlayaniTotal += siswaTerlayaniKelas;
      kelasBreakdown.push({
        kelas, jumlahSiswa: jumlahDiKelas, siswaTerlayani: siswaTerlayaniKelas,
        persenTerlayani: Math.round((siswaTerlayaniKelas/jumlahDiKelas)*1000)/10,
        kasusCount: kelasKasus
      });
    }
  });
  const administrasiCount = (DB.administrasi||[]).filter(r => (r.guru||'').trim().toLowerCase() === (p.nama||'').trim().toLowerCase()).length;
  const total = layanan + kasus + klasikal + homeVisit;
  const hasJumlahSiswaData = jumlahSiswaTotal > 0;
  const persenTerlayaniTotal = hasJumlahSiswaData ? Math.round((siswaTerlayaniTotal/jumlahSiswaTotal)*1000)/10 : null;
  const totalBidangFreq = Object.values(bidangFreq).reduce((a,n)=>a+n,0);
  const bidangBreakdown = BIDANG_BK_OPTIONS.map(b=>({
    bidang:b, frekuensi:bidangFreq[b],
    persen: totalBidangFreq>0 ? Math.round((bidangFreq[b]/totalBidangFreq)*1000)/10 : 0
  }));
  return { id:p.id, nama:p.nama, assignedKelas, layanan, kasus, klasikal, homeVisit, administrasiCount, total, jumlahSiswaTotal, siswaTerlayaniTotal, persenTerlayaniTotal, kelasBreakdown, hasJumlahSiswaData, bidangBreakdown, totalBidangFreq };
}

function collectPersonalBKInfografisRows(){
  const activeId = DB.settings.activePersonalBKId;
  return (DB.personalBK||[]).filter(p=>p.id===activeId).map(computePersonalBKAnalysisRow).sort((a,b)=> b.total - a.total);
}

function collectAllPersonalBKAnalysis(){
  return (DB.personalBK||[]).map(computePersonalBKAnalysisRow).sort((a,b)=> b.total - a.total);
}

          <span>Frekuensi Permasalahan Siswa Tertangani: <b>${r.kasus} kasus</b></span>

function exportPersonalBKInfografisExcel(){
  const rows = collectPersonalBKInfografisRows();
  if(!rows.length){ toast('Tidak ada data untuk dicetak', true); return; }
  const wb = XLSX.utils.book_new();
  const title = 'INFO GRAFIS PERSONAL BK SMP AL HIKMAH SURABAYA';
  let aoa = [[title],[]];
  aoa.push(['No','Nama Personal BK','Kelas Ditugaskan','Layanan BK','Permasalahan','Klasikal','Home Visit','Total Layanan','Jumlah Siswa','Konseling Individu Siswa','% Terlayani']);
  rows.forEach((r,i)=> aoa.push([i+1, r.nama, r.assignedKelas.join(', ')||'-', r.layanan, r.kasus, r.klasikal, r.homeVisit, r.total, r.jumlahSiswaTotal||'-', r.siswaTerlayaniTotal||'-', r.hasJumlahSiswaData ? r.persenTerlayaniTotal+'%' : '-']));
  const ws = XLSX.utils.aoa_to_sheet(aoa);

async function handleImportSiswaFile(){
  const input = document.getElementById('importSiswaFile');
  const file = input && input.files && input.files[0];
  if(!file){ toast('Pilih berkas Excel/CSV terlebih dahulu', true); return; }
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const aoa = XLSX.utils.sheet_to_json(ws, { header:1, raw:false, defval:'' });
    await processImportSiswaRows(aoa);
  }catch(e){
    toast('Gagal membaca berkas. Pastikan formatnya sesuai template.', true);
  }
}

async function processImportSiswaRows(aoa){
  const assigned = assignedKelasList();
  let added = 0, updated = 0;
  const skipped = [];
  for(let i=1; i<aoa.length; i++){
    const row = aoa[i] || [];
    const induk = String(row[0]||'').trim();
    const nama = String(row[1]||'').trim();
    const kelas = String(row[2]||'').trim().toUpperCase();
    if(!induk && !nama && !kelas) continue;
    if(!/^\d{4}$/.test(induk)){ skipped.push(`Baris ${i+1}: Nomor Induk "${esc(induk)||'(kosong)'}" tidak valid (wajib 4 angka)`); continue; }
    if(!nama){ skipped.push(`Baris ${i+1}: Nama Siswa kosong (Induk ${esc(induk)})`); continue; }
    if(!assigned.includes(kelas)){ skipped.push(`Baris ${i+1}: Kelas "${esc(kelas)||'(kosong)'}" bukan kelas yang ditugaskan ke Anda (Induk ${esc(induk)})`); continue; }
    const existing = findStudent(induk);
    if(existing){ existing.nama = nama; existing.kelas = kelas; updated++; }
    else { DB.students.push({ induk, nama, kelas }); added++; }
  }
  if(added || updated) await saveStudents();
  STATE.importSiswaResult = { added, updated, skipped };
  if(added || updated){
    toast(`Import selesai: ${added} siswa baru, ${updated} diperbarui`);
  } else {
    toast('Tidak ada data valid yang berhasil diimpor', true);
  }
  render();
}

function filteredStudents(){
  const students = DB.students;
  const assigned = assignedKelasList();
  let rows = students.slice().filter(s => assigned.includes(s.kelas));
  if(STATE.filterKelas) rows = rows.filter(s=>s.kelas===STATE.filterKelas);
  if(STATE.searchQ){
    const q = STATE.searchQ.toLowerCase();
    rows = rows.filter(s => s.nama.toLowerCase().includes(q) || String(s.induk).includes(q));
  }
  rows.sort((a,b)=> a.nama.localeCompare(b.nama));
  return rows;
}

function computeBidangFrequency(induk){
  const freq = {};
  BIDANG_BK_OPTIONS.forEach(b=> freq[b]=0);
  (DB.layanan[induk]||[]).forEach(r=>{ if(r.bidang && freq[r.bidang]!==undefined) freq[r.bidang]++; });
  (DB.kasus[induk]||[]).forEach(r=>{ if(r.bidang && freq[r.bidang]!==undefined) freq[r.bidang]++; });
  return freq;
}
function computeBidangFrequencyInLaporan(induk){
  const freq = {};
  BIDANG_BK_OPTIONS.forEach(b=> freq[b]=0);
  (DB.layanan[induk]||[]).forEach(r=>{ if(r.bidang && freq[r.bidang]!==undefined && inLaporanDateRange(r.tgl)) freq[r.bidang]++; });
  (DB.kasus[induk]||[]).forEach(r=>{ if(r.bidang && freq[r.bidang]!==undefined && inLaporanDateRange(r.tgl)) freq[r.bidang]++; });
  return freq;
}

async function saveEditStudent(oldInduk){
  const newInduk = document.getElementById('esInduk').value.trim();
  const nama = document.getElementById('esNama').value.trim();
  const kelas = document.getElementById('esKelas').value;
  if(!newInduk || !nama || !kelas){ toast('Lengkapi semua isian', true); return; }
  if(!/^\d{4}$/.test(newInduk)){ toast('Nomor Induk wajib 4 angka', true); return; }
  if(newInduk !== oldInduk && findStudent(newInduk)){ toast('Nomor Induk tersebut sudah dipakai siswa lain', true); return; }

  const s = findStudent(oldInduk);
  if(!s){ toast('Data siswa tidak ditemukan', true); return; }

  s.nama = nama;
  s.kelas = kelas;

  if(newInduk !== oldInduk){
    s.induk = newInduk;
    await loadLayanan(oldInduk); await loadKasus(oldInduk);
    DB.layanan[newInduk] = DB.layanan[oldInduk] || [];
    DB.kasus[newInduk] = DB.kasus[oldInduk] || [];
    delete DB.layanan[oldInduk];
    delete DB.kasus[oldInduk];
    await saveLayanan(newInduk);
    await saveKasus(newInduk);
    await sDel('layanan_'+oldInduk);
    await sDel('kasus_'+oldInduk);
  }

  // Sinkronkan catatan Home Visit yang merujuk siswa ini (menyimpan salinan nama/kelas)
  await loadHomeVisit();
  let hvChanged = false;
  (DB.homeVisit||[]).forEach(r=>{
    if(r.induk === oldInduk){
      r.induk = newInduk; r.nama = nama; r.kelas = kelas;
      hvChanged = true;
    }
  });
  if(hvChanged) await saveHomeVisit();

  await saveStudents();
  STATE.editingStudentInduk = null;
  toast('Data siswa berhasil diperbarui');
  render();
}

function renderKelompokRowsHtml(){
  return STATE.kelompokMembers.map((m,i)=>`
    <div class="grid3" style="align-items:end;">
      <div class="field">
        <label>Nomor Induk</label>
        <input type="text" class="kr-induk" data-i="${i}" value="${esc(m.induk)}" placeholder="mis. 5437" inputmode="numeric" pattern="\\d{4}" maxlength="4">
      </div>
      <div class="field">
        <label>Nama Siswa</label>
        <input type="text" class="kr-nama" data-i="${i}" value="${esc(m.nama)}" placeholder="Nama lengkap siswa">
      </div>
      <div class="field">
        <label>Kelas</label>
        <select class="kr-kelas" data-i="${i}">
          <option value="">Pilih kelas…</option>
          ${assignedKelasList().map(k=>`<option value="${k}" ${m.kelas===k?'selected':''}>${k}</option>`).join('')}
        </select>
      </div>
    </div>
    ${STATE.kelompokMembers.length>2 ? `<div class="btnrow" style="margin:-6px 0 14px;"><button type="button" class="btn btn-ghost btn-sm" onclick="removeKelompokRow(${i})">Hapus anggota ke-${i+1}</button></div>` : `<div style="margin-bottom:14px;"></div>`}
  `).join('');
}

function bindKelompokRowInputs(){
  document.querySelectorAll('.kr-induk').forEach(el=> el.oninput = e=>{ STATE.kelompokMembers[+e.target.dataset.i].induk = e.target.value; });
  document.querySelectorAll('.kr-nama').forEach(el=> el.oninput = e=>{ STATE.kelompokMembers[+e.target.dataset.i].nama = e.target.value; });
  document.querySelectorAll('.kr-kelas').forEach(el=> el.onchange = e=>{ STATE.kelompokMembers[+e.target.dataset.i].kelas = e.target.value; });
}

function addKelompokRow(){
  STATE.kelompokMembers.push({induk:'',nama:'',kelas:''});
  const wrap = document.getElementById('kelompokRows');
  if(wrap){ wrap.innerHTML = renderKelompokRowsHtml(); bindKelompokRowInputs(); }
}
function removeKelompokRow(i){
  if(STATE.kelompokMembers.length<=1) return;
  STATE.kelompokMembers.splice(i,1);
  const wrap = document.getElementById('kelompokRows');
  if(wrap){ wrap.innerHTML = renderKelompokRowsHtml(); bindKelompokRowInputs(); }
}

async function submitKelompok(){
  const members = STATE.kelompokMembers
    .map(m=>({induk:m.induk.trim(), nama:m.nama.trim(), kelas:m.kelas}))
    .filter(m=>m.induk && m.nama && m.kelas);
  if(members.length<2){ toast('Lengkapi minimal 2 anggota kelompok (Nomor Induk, Nama, Kelas)', true); return; }
  const invalidInduk = members.find(m => !/^\d{4}$/.test(m.induk));
  if(invalidInduk){ toast(`Nomor Induk "${invalidInduk.induk}" tidak valid — wajib 4 angka`, true); return; }
  for(const m of members){
    let s = findStudent(m.induk);
    if(!s){ s = {induk:m.induk, nama:m.nama, kelas:m.kelas}; DB.students.push(s); }
    else { s.nama = m.nama; s.kelas = m.kelas; }
    await loadLayanan(m.induk); await loadKasus(m.induk);
  }
  await saveStudents();
  STATE.currentKelompokMembers = members;
  STATE.kelompokMembers = [{induk:'',nama:'',kelas:''},{induk:'',nama:'',kelas:''}];
  STATE.view = 'kelompok';
  render();
}

/* ---------- LAYANAN KLASIKAL BK ---------- */
async function ensureKlasikalLoadedAll(force){
  await Promise.all(KELAS_LIST.map(k => loadKlasikal(k, force)));
}
function buildKlasikalRowsHtml(){
  if(STATE.klasikalSuperClosed) return buildKlasikalSuperClosedSummary();
  const kelasFilter = STATE.klasikalFilterKelas;
  const scope = kelasFilter ? [kelasFilter] : assignedKelasList();
  const groups = [];
  scope.forEach(k=>{
    const recs = (DB.klasikal[k]||[]).slice();
    if(recs.length){
      recs.sort((a,b)=> (b.tgl||'').localeCompare(a.tgl||'') || (b.createdAt-a.createdAt));
      groups.push({ kelas:k, recs });
    }
  });
  if(!groups.length) return `<div class="empty"><div class="big">Belum ada catatan Layanan Klasikal BK</div>Gunakan formulir di atas untuk menambahkan.</div>`;
  return groups.map(g => buildKlasikalClassGroupHtml(g)).join('');
}

function buildKlasikalSuperClosedSummary(){
  const withData = assignedKelasList().filter(k => (DB.klasikal[k]||[]).length > 0);
  if(!withData.length){
    return `<div class="empty">Belum ada kelas yang tercatat pada Layanan Klasikal BK.</div>`;
  }
  return `<div class="empty" style="border-style:solid;background:var(--teal-50);">Ada <b>${withData.length} kelas</b> ${esc(withData.join(', '))} tercatat.</div>`;
}

function buildKlasikalClassGroupHtml(g){
  const closed = !!STATE.klasikalClosedClasses[g.kelas];
  const header = `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--teal-50);border:1.5px solid var(--teal-100);border-radius:9px;padding:12px 16px;margin-bottom:${closed ? '10px' : '8px'};">
      <div style="font-weight:700;color:var(--teal-900);font-size:14.5px;">Kelas ${esc(g.kelas)} <span class="pill pill-gold" style="margin-left:8px;">${g.recs.length} catatan</span></div>
      <button class="btn btn-outline btn-sm" onclick="toggleKlasikalClass('${esc(g.kelas)}')">${closed ? '&#9660; Tampilkan Kelas' : '&#9650; Tutup Kelas'}</button>
    </div>`;
  if(closed) return header;
  const recordsHtml = g.recs.map(r => buildKlasikalRecordHtml(Object.assign({}, r, { kelas: g.kelas }))).join('');
  return header + recordsHtml;
}

function buildKlasikalRecordHtml(r){
  if(STATE.klasikalEditingId === r.id) return renderKlasikalEditForm(r);
  const expanded = !!STATE.klasikalExpandedIds[r.id];
  return `
    <div class="record">
      <div class="rtop">
        <div class="tag">Kelas ${esc(r.kelas)} &middot; Pertemuan ke-${esc(r.pertemuanKe)}</div>

      </div>
      ${expanded ? `
      <div class="rbody"><b>Materi Layanan:</b> ${esc(r.materi)}</div>
      <div class="rmeta"><span>Jam ke: <b>${esc(r.jamKe)}</b></span><span>Guru BK: <b>${esc(r.guru||'-')}</b></span></div>
      <div class="ractions">
        <button class="btn btn-outline btn-sm" onclick="startEditKlasikal('${esc(r.kelas)}','${r.id}')">&#9998; Edit</button>
        <button class="btn btn-ghost btn-sm" onclick="deleteKlasikal('${esc(r.kelas)}','${r.id}')">Hapus catatan ini</button>
        <button class="btn btn-ghost btn-sm" onclick="toggleKlasikalExpand('${r.id}')">&#9650; Tutup Riwayat</button>
      </div>` : `
      <div class="ractions">
        <button class="btn btn-outline btn-sm" onclick="toggleKlasikalExpand('${r.id}')">&#9660; Tampilkan Riwayat</button>
      </div>`}
    </div>
  `;
}

function showKlasikalHeaders(){
  STATE.klasikalSuperClosed = false;
  KELAS_LIST.forEach(k => {
    STATE.klasikalClosedClasses[k] = false;
    (DB.klasikal[k]||[]).forEach(r => { STATE.klasikalExpandedIds[r.id] = false; });
  });
  STATE.klasikalEditingId = null;
  render();
}
function expandAllKlasikal(){
  STATE.klasikalSuperClosed = false;
  assignedKelasList().forEach(k => {
    STATE.klasikalClosedClasses[k] = false;
    (DB.klasikal[k]||[]).forEach(r => { STATE.klasikalExpandedIds[r.id] = true; });
  });
  render();
}
function collapseAllKlasikal(){
  STATE.klasikalSuperClosed = true;
  STATE.klasikalEditingId = null;
  render();
}
function startEditKlasikal(kelas, id){
  STATE.klasikalEditingId = id;
  STATE.klasikalExpandedIds[id] = true;
  render();
}
function cancelEditKlasikal(){
  STATE.klasikalEditingId = null;
  render();
}
async function saveEditKlasikal(oldKelas, id){
  const tgl = document.getElementById('keTgl').value;
  const newKelas = document.getElementById('keKelas').value;
  const jamKe = document.getElementById('keJamKe').value.trim();
  const pertemuanKe = document.getElementById('kePertemuanKe').value.trim();
  const materi = document.getElementById('keMateri').value.trim();
  const guru = document.getElementById('keGuru').value.trim();
  if(!tgl || !newKelas || !jamKe || !pertemuanKe || !materi){ toast('Lengkapi semua isian', true); return; }

  await loadKlasikal(oldKelas);
  const idx = DB.klasikal[oldKelas].findIndex(x=>x.id===id);
  if(idx<0){ toast('Catatan tidak ditemukan', true); return; }
  const updated = Object.assign({}, DB.klasikal[oldKelas][idx], {tgl, jamKe, pertemuanKe, materi, guru});

  if(newKelas !== oldKelas){
    DB.klasikal[oldKelas].splice(idx,1);
    await saveKlasikal(oldKelas);
    await loadKlasikal(newKelas);
    DB.klasikal[newKelas] = DB.klasikal[newKelas] || [];
    DB.klasikal[newKelas].push(updated);
    await saveKlasikal(newKelas);
  } else {
    DB.klasikal[oldKelas][idx] = updated;
    await saveKlasikal(oldKelas);
  }
  DB.settings.lastGuru = guru;
  await sSet('settings', DB.settings);
  STATE.klasikalEditingId = null;
  STATE.klasikalExpandedIds[id] = true;
  toast('Perubahan Layanan Klasikal BK tersimpan');
  render();
}
async function deleteKlasikal(kelas, id){
  const ok = await confirmModal('Hapus Catatan Layanan Klasikal', 'Catatan ini akan dihapus permanen. Lanjutkan?', 'Hapus', true);
  if(!ok) return;
  DB.klasikal[kelas] = (DB.klasikal[kelas]||[]).filter(r=>r.id!==id);
  await saveKlasikal(kelas);
  if(STATE.klasikalEditingId===id) STATE.klasikalEditingId = null;
  delete STATE.klasikalExpandedIds[id];
  toast('Catatan Layanan Klasikal dihapus');
  render();
}

function inLaporanDateRange(tgl){
  if(!STATE.laporanTglMulai && !STATE.laporanTglSelesai) return true;
  if(!tgl) return false;
  if(STATE.laporanTglMulai && tgl < STATE.laporanTglMulai) return false;
  if(STATE.laporanTglSelesai && tgl > STATE.laporanTglSelesai) return false;
  return true;
}
function inLaporanDateRangeSpan(tglMulai, tglSelesai){
  if(!STATE.laporanTglMulai && !STATE.laporanTglSelesai) return true;
  const start = tglMulai || tglSelesai;
  const end = tglSelesai || tglMulai;
  if(!start) return false;
  if(STATE.laporanTglMulai && end < STATE.laporanTglMulai) return false;
  if(STATE.laporanTglSelesai && start > STATE.laporanTglSelesai) return false;
  return true;
}
function collectAdministrasiRows(source){
  const catFilter = source==='laporan' ? STATE.laporanKategoriAdministrasi : STATE.administrasiFilterKategori;
  let rows = [];
  (DB.administrasi||[]).forEach(r=>{
    if(source==='laporan' && !inLaporanDateRange(r.tgl)) return;
    r.items.forEach(it=>{
      if(catFilter && it.catKey!==catFilter) return;
      rows.push({tgl:r.tgl, guru:r.guru, kategori:it.catLabel, item:it.itemLabel, keterangan:it.keterangan});
    });
  });
  rows.sort((a,b)=> (a.tgl||'').localeCompare(b.tgl||''));
  return {rows, catFilter};
}

function exportAdministrasiExcel(source){
  const {rows, catFilter} = collectAdministrasiRows(source);
  if(!rows.length){ toast('Tidak ada data untuk dicetak', true); return; }
  const catLabel = (ADMINISTRASI_CATEGORIES.find(c=>c.key===catFilter)||{}).label || 'Semua Kategori';
  const wb = XLSX.utils.book_new();
  const title = 'HASIL LAYANAN ADMINISTRASI BK SMP AL HIKMAH SURABAYA';
  const subtitle = 'Kategori: ' + catLabel;
  let aoa = [[title],[subtitle],[]];
  aoa.push(['No','Tanggal','Guru BK','Kategori','Kegiatan','Keterangan']);
  rows.forEach((r,i)=> aoa.push([i+1, fmtDateID(r.tgl), r.guru, r.kategori, r.item, r.keterangan]));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:5},{wch:14},{wch:18},{wch:26},{wch:36},{wch:40}];
  XLSX.utils.book_append_sheet(wb, ws, 'Administrasi BK');
  XLSX.writeFile(wb, `Administrasi_BK_${todayISO()}.xlsx`);
  toast('Berkas Excel diunduh');
}

function exportAdministrasiPDF(source){
  const {rows, catFilter} = collectAdministrasiRows(source);

  const catLabel = (ADMINISTRASI_CATEGORIES.find(c=>c.key===catFilter)||{}).label || 'Semua Kategori';
  const { jsPDF } = window.jspdf;

    startY: y+8, styles:{fontSize:8.5, cellPadding:5, valign:'top'},
    headStyles:{fillColor:[13,59,54], textColor:255},
    columnStyles:{0:{cellWidth:22},1:{cellWidth:60},3:{cellWidth:90}},
    margin:{left:40,right:40}
  });
  doc.save(`Administrasi_BK_${todayISO()}.pdf`);
  toast('Berkas PDF diunduh');
}

function collectWawancaraRows(source){

function bindGlobalHandlers(){
  const formIdentitas = document.getElementById('formIdentitas');
  if(formIdentitas){
    formIdentitas.addEventListener('submit', async e=>{
      e.preventDefault();
      const induk = document.getElementById('fNomorInduk').value.trim();
      const nama = document.getElementById('fNamaSiswa').value.trim();
      const kelas = document.getElementById('fKelas').value;
      if(!induk || !nama || !kelas){ toast('Lengkapi semua isian identitas', true); return; }
      if(!/^\d{4}$/.test(induk)){ toast('Nomor Induk wajib 4 angka', true); return; }
      let s = findStudent(induk);
      if(!s){
        s = {induk, nama, kelas};
        DB.students.push(s);
      } else {
        s.nama = nama; s.kelas = kelas;
      }
      await saveStudents();
      await loadLayanan(induk); await loadKasus(induk);
      toast('Identitas siswa disimpan');
      document.getElementById('afterSaveBox').innerHTML = `
        <div class="warnbox" style="margin-top:14px;">
          <div class="wtitle">✅ ${esc(nama)} (${esc(induk)} — ${esc(kelas)}) siap dilanjutkan</div>
          <div class="btnrow" style="margin-top:8px;">
            <button class="btn btn-primary" onclick="goSiswa('${esc(induk)}','layanan')">Lanjut ke Layanan BK →</button>
            <button class="btn btn-gold" onclick="goSiswa('${esc(induk)}','permasalahan')">Lanjut ke Permasalahan Siswa →</button>
          </div>
        </div>`;
    });
  }
  const qSearch = document.getElementById('qSearch');
  if(qSearch) qSearch.addEventListener('input', e=>{ STATE.searchQ = e.target.value; updateStudentTable(); });
  const qKelas = document.getElementById('qKelas');
  if(qKelas) qKelas.addEventListener('change', e=>{ STATE.filterKelas = e.target.value; updateStudentTable(); });
  const unservedSearchInput = document.getElementById('unservedSearchQ');
  if(unservedSearchInput) unservedSearchInput.addEventListener('input', e=>{ STATE.unservedSearchQ = e.target.value; updateUnservedSection(); });

  bindKelompokRowInputs();
  bindUpgradingPembicaraInputs();

  const hvInduk = document.getElementById('hvInduk');
  if(hvInduk) hvInduk.addEventListener('blur', e=>{
    const s = findStudent(e.target.value.trim());
    if(s){
      const hvNama = document.getElementById('hvNama');
      const hvKelas = document.getElementById('hvKelas');
      if(hvNama && !hvNama.value.trim()) hvNama.value = s.nama;
      if(hvKelas && !hvKelas.value) hvKelas.value = s.kelas;
    }
  });

  const formKlasikal = document.getElementById('formKlasikal');
  if(formKlasikal){
    formKlasikal.addEventListener('submit', async e=>{
      e.preventDefault();
      const kelas = document.getElementById('ksKelas').value;
      const rec = {
        id: uid(),
        tgl: document.getElementById('ksTgl').value,
        jamKe: document.getElementById('ksJamKe').value.trim(),
        pertemuanKe: document.getElementById('ksPertemuanKe').value.trim(),
        materi: document.getElementById('ksMateri').value.trim(),
        guru: document.getElementById('ksGuru').value.trim(),
        createdAt: Date.now()
      };
      if(!kelas || !rec.tgl || !rec.jamKe || !rec.pertemuanKe || !rec.materi){ toast('Lengkapi semua isian Layanan Klasikal', true); return; }
      await loadKlasikal(kelas);
      DB.klasikal[kelas].push(rec);
      await saveKlasikal(kelas);
      DB.settings.lastGuru = rec.guru;
      await sSet('settings', DB.settings);
      toast('Layanan Klasikal BK tersimpan');
      render();
    });
  }
  const ksFilterKelas = document.getElementById('ksFilterKelas');
  if(ksFilterKelas) ksFilterKelas.addEventListener('change', e=>{ STATE.klasikalFilterKelas = e.target.value; render(); });

  const tahunAjaran = document.getElementById('tahunAjaran');
  if(tahunAjaran) tahunAjaran.addEventListener('change', async e=>{
    DB.settings.tahunAjaran = e.target.value;
    await sSet('settings', DB.settings);
    toast('Tahun ajaran diperbarui: ' + e.target.value);
  });
}

async function handleDeleteStudent(induk){
  const s = findStudent(induk);
  if(!s) return;
  const ok = await confirmModal('Hapus Data Siswa', `Semua data <b>${esc(s.nama)}</b> (Layanan BK &amp; Permasalahan) akan dihapus permanen. Lanjutkan?`, 'Hapus', true);
  if(!ok) return;
  DB.students = DB.students.filter(x=>x.induk!==induk);
  await saveStudents();
  await sDel('layanan_'+induk);
  await sDel('kasus_'+induk);
  delete DB.layanan[induk]; delete DB.kasus[induk];
  toast('Data siswa dihapus');
  if(STATE.currentInduk===induk){ STATE.view='beranda'; STATE.currentInduk=null; }
  render();
}

async function renderSiswa(){
  const induk = STATE.currentInduk;
  const s = findStudent(induk);
  if(!s || !assignedKelasList().includes(s.kelas)){
    STATE.view='beranda'; STATE.currentInduk=null;
    toast('Siswa tersebut di luar kelas yang Anda tugaskan', true);
    return await renderBeranda();
  }
  await loadLayanan(induk); await loadKasus(induk);

  const head = `
    <div class="studenthead">
      <div class="who">
        <div class="nm">${esc(s.nama)}</div>
        <div class="meta">Nomor Induk ${esc(s.induk)} &nbsp;&middot;&nbsp; Kelas ${esc(s.kelas)}</div>
      </div>
      <div class="tabs">
        <button class="${STATE.siswaTab==='layanan'?'active':''}" onclick="switchSiswaTab('layanan')">Halaman 2 &middot; Layanan BK</button>
        <button class="${STATE.siswaTab==='permasalahan'?'active':''}" onclick="switchSiswaTab('permasalahan')">Halaman 3 &middot; Permasalahan Siswa</button>

function checkRepeatedCase(induk, namaKasus){
  const recs = DB.kasus[induk] || [];
  const same = recs.filter(r => r.namaKasus === namaKasus);
  const box = document.getElementById('riwayatBerulangBox');
  if(!box) return;
  if(!namaKasus || same.length===0){ box.innerHTML=''; return; }
  const list = same.slice().sort((a,b)=>(b.tgl||'').localeCompare(a.tgl||'')).slice(0,3).map(r=>
    `<li><b>${fmtDateID(r.tgl)}:</b> ${esc(shortText(r.kronologis,110))} <br><span style="color:#7a6a3a;">&rarr; Penanganan sebelumnya: ${esc(shortText(r.penanganan,110))}</span></li>`
  ).join('');
  box.innerHTML = `
    <div class="warnbox">
      <div class="wtitle">&#9888; Kasus "${esc(namaKasus)}" pernah terjadi ${same.length}&times; pada siswa ini</div>
      <div class="wbody">
        Riwayat sebelumnya:
        <ul>${list}</ul>
        Karena permasalahan berulang, pertimbangkan langkah lanjutan:
        <ul>
          <li>Tinjau efektivitas penanganan sebelumnya sebelum menetapkan langkah baru.</li>
          <li>Libatkan wali kelas/orang tua secara lebih intensif dan buat kesepakatan tertulis.</li>
          <li>Pertimbangkan koordinasi dengan Manajemen/Wakasis jika pola terus berulang.</li>
          <li>Dokumentasikan pola perilaku untuk bahan evaluasi tim BK.</li>
        </ul>
      </div>
    </div>`;
}

      id: uid(),
      tgl: document.getElementById('hvTgl').value,
      induk: document.getElementById('hvInduk').value.trim(),
      nama: document.getElementById('hvNama').value.trim(),
      kelas: document.getElementById('hvKelas').value,
      catatan: document.getElementById('hvCatatan').value.trim(),
      waliKelas: document.getElementById('hvWaliKelas').value.trim(),
      createdAt: Date.now()
    };

    const jenis = document.getElementById('upJenis').value;
    const judul = document.getElementById('upJudul').value.trim();
    const penyelenggara = document.getElementById('upPenyelenggara').value.trim();
    const catatan = document.getElementById('upCatatan').value.trim();
    const pembicara = STATE.upgradingPembicara.map(p=>p.trim()).filter(p=>p);
    if(!tglMulai || !tglSelesai || !jenis || !judul){ toast('Lengkapi awal pelaksanaan, akhir pelaksanaan, jenis kegiatan, dan judul/tema kegiatan', true); return; }

    await loadUpgrading();

    let items = [];

    ADMINISTRASI_CATEGORIES.forEach(cat=>{
      cat.items.forEach(item=>{
        const chk = document.getElementById(`adm_${cat.key}_${item.key}`);
        if(chk && chk.checked){
          let ket = '';
          if(item.hasKet){
            const ketEl = document.getElementById(`admKet_${cat.key}_${item.key}`);
            ket = ketEl ? ketEl.value.trim() : '';
            if(item.required && !ket) hasError = true;
          }
          items.push({catKey:cat.key, catLabel:cat.label, itemKey:item.key, itemLabel:item.label, keterangan:ket});
        }
      });
    });
    if(hasError){ toast('Keterangan wajib diisi untuk item "Lainnya"', true); return; }

    await loadAdministrasi();
    DB.administrasi.push({ id: uid(), tgl, guru, items, createdAt: Date.now() });
    await saveAdministrasi();
    DB.settings.lastGuru = guru;
    await sSet('settings', DB.settings);
    toast('Administrasi BK tersimpan');
    render();
  }
});

  const ok = await confirmModal('Hapus Catatan Layanan BK', 'Catatan ini akan dihapus permanen. Lanjutkan?', 'Hapus', true);
  if(!ok) return;
  DB.layanan[induk] = (DB.layanan[induk]||[]).filter(r=>r.id!==id);
  await saveLayanan(induk);
  if(STATE.layananEditingId===id) STATE.layananEditingId = null;
  toast('Catatan layanan BK dihapus');
  render();
}
async function deleteKasus(induk, id){
  const ok = await confirmModal('Hapus Catatan Permasalahan', 'Catatan ini akan dihapus permanen. Lanjutkan?', 'Hapus', true);
  if(!ok) return;
  DB.kasus[induk] = (DB.kasus[induk]||[]).filter(r=>r.id!==id);
  await saveKasus(induk);
  if(STATE.kasusEditingId===id) STATE.kasusEditingId = null;
  toast('Catatan permasalahan dihapus');
  render();
}

async function ensureAllLoaded(){
  // Ambil ulang daftar siswa dari storage (bisa saja berubah di sesi/tab lain)
  const freshStudents = await sGet('students');
  if(freshStudents){
    DB.students = freshStudents;
  }
  await Promise.all([
    ...DB.students.flatMap(s => [loadLayanan(s.induk, true), loadKasus(s.induk, true)]),
    ensureKlasikalLoadedAll(true),
    loadAdministrasi(true),
    loadWawancaraWali(true),
    loadUpgrading(true),
    loadHomeVisit(true),
    loadPersonalBK(true)
  ]);
}

function laporanPeriodeLabel(){
  if(!STATE.laporanTglMulai && !STATE.laporanTglSelesai) return 'Periode: Seluruh Data';
  return `Periode: ${STATE.laporanTglMulai ? fmtDateID(STATE.laporanTglMulai) : 'awal'} - ${STATE.laporanTglSelesai ? fmtDateID(STATE.laporanTglSelesai) : 'sekarang'}`;
}
function laporanKelasLabel(){
  if(STATE.laporanKelas) return 'Kelas: ' + STATE.laporanKelas;
  const assigned = assignedKelasList();
  return 'Kelas: ' + (assigned.length ? assigned.join(', ') : '-');
}
function laporanPersonalBKLabel(){
  const active = activePersonalBK();
  return 'Personal BK: ' + (active ? active.nama : '-');
}
function laporanTahunAjaranLabel(){
  return 'Tahun Ajaran: ' + (DB.settings.tahunAjaran || '-');
}
function computeBidangRekap(layananRows, kasusRows){
  const freq = {}; BIDANG_BK_OPTIONS.forEach(b=>freq[b]=0);
  [...layananRows, ...kasusRows].forEach(r=>{ if(r.bidang && freq[r.bidang]!==undefined) freq[r.bidang]++; });
  const total = Object.values(freq).reduce((a,n)=>a+n,0);
  const rows = BIDANG_BK_OPTIONS.map(b=>({ bidang:b, frekuensi:freq[b], persen: total>0 ? Math.round((freq[b]/total)*1000)/10 : 0 }));
  return { rows, total };
}

function exportLaporanLengkapExcel(){
  const { rows: layananRows } = collectLayananRows(null);
  const { rows: kasusRows } = collectKasusRows(null);
  const { rows: klasikalRows } = collectKlasikalRows('laporan');
  const hvRows = collectHomeVisitRows('laporan');
  const { rows: admRows } = collectAdministrasiRows('laporan');
  const wwRows = collectWawancaraRows('laporan');
  const { rows: upRows } = collectUpgradingRows('laporan');

  const totalAll = layananRows.length + kasusRows.length + klasikalRows.length + hvRows.length + admRows.length + wwRows.length + upRows.length;
  if(!totalAll){ toast('Tidak ada data pada rentang tanggal/kelas yang dipilih', true); return; }

  const wb = XLSX.utils.book_new();
  const addSheet = (name, head, rows, mapRow) => {
    if(!rows.length) return;
    const aoa = [[name.toUpperCase() + ' — SMP AL HIKMAH SURABAYA'], [laporanTahunAjaranLabel() + '  |  ' + laporanPeriodeLabel() + '  |  ' + laporanKelasLabel() + '  |  ' + laporanPersonalBKLabel()], [], head];
    rows.forEach((r,i)=> aoa.push(mapRow(r,i)));
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    XLSX.utils.book_append_sheet(wb, ws, name);
  };

  const bidangRekap = computeBidangRekap(layananRows, kasusRows);
  const rk = computeRingkasanData();
  const infoRows = collectPersonalBKInfografisRows();

  // Sheet: Ringkasan Data
  let aoaRK = [['RINGKASAN DATA — SMP AL HIKMAH SURABAYA'], [laporanTahunAjaranLabel() + '  |  ' + laporanPersonalBKLabel()], []];
  aoaRK.push(['Kategori','Jumlah']);
  aoaRK.push(['Jumlah Siswa', rk.jumlahSiswa]);
  aoaRK.push(['Total Catatan Layanan BK', rk.totalLayanan]);
  aoaRK.push(['Total Catatan Permasalahan', rk.totalKasus]);
  aoaRK.push(['Total Layanan Klasikal BK', rk.totalKlasikal]);
  aoaRK.push(['Total Catatan Administrasi BK', rk.totalAdministrasi]);
  aoaRK.push(['Total Wawancara Wali Murid Kelas 7', rk.totalWawancara]);
  aoaRK.push(['Total Upgrading Personal BK', rk.totalUpgrading]);
  aoaRK.push(['Total Home Visit', rk.totalHomeVisit]);
  aoaRK.push(['Jumlah Personal BK', rk.totalPersonalBK]);
  const wsRK = XLSX.utils.aoa_to_sheet(aoaRK);
  wsRK['!cols'] = [{wch:32},{wch:12}];
  XLSX.utils.book_append_sheet(wb, wsRK, 'Ringkasan Data');

  // Sheet: Info Grafis Personal BK (ringkasan utama)
  if(infoRows.length){
    let aoaIG = [['INFO GRAFIS PERSONAL BK — SMP AL HIKMAH SURABAYA'], [laporanPersonalBKLabel()], []];
    aoaIG.push(['Nama Personal BK','Kelas Ditugaskan','Layanan BK','Permasalahan','Klasikal','Home Visit','Total Layanan','Jumlah Siswa','Konseling Individu Siswa','% Terlayani']);
    infoRows.forEach(r=> aoaIG.push([r.nama, r.assignedKelas.join(', ')||'-', r.layanan, r.kasus, r.klasikal, r.homeVisit, r.total, r.jumlahSiswaTotal||'-', r.siswaTerlayaniTotal||'-', r.hasJumlahSiswaData ? r.persenTerlayaniTotal+'%' : '-']));
    const wsIG = XLSX.utils.aoa_to_sheet(aoaIG);
    wsIG['!cols'] = [{wch:28},{wch:40},{wch:12},{wch:12},{wch:10},{wch:11},{wch:13},{wch:12},{wch:14},{wch:11}];
    XLSX.utils.book_append_sheet(wb, wsIG, 'Info Grafis Personal BK');

    const igKelasRows = infoRows.flatMap(r => r.kelasBreakdown.map(kb => ({nama:r.nama, ...kb})));
    if(igKelasRows.length){
      let aoaIGK = [['INFO GRAFIS — RINCIAN PER KELAS'],[]];
      aoaIGK.push(['Nama Personal BK','Kelas','Jumlah Siswa','Konseling Individu Siswa','% Terlayani','Frekuensi Kasus']);
      igKelasRows.forEach(kb=> aoaIGK.push([kb.nama, kb.kelas, kb.jumlahSiswa, kb.siswaTerlayani, kb.persenTerlayani+'%', kb.kasusCount]));
      const wsIGK = XLSX.utils.aoa_to_sheet(aoaIGK);
      wsIGK['!cols'] = [{wch:28},{wch:8},{wch:12},{wch:14},{wch:11},{wch:14}];
      XLSX.utils.book_append_sheet(wb, wsIGK, 'IG Rincian Per Kelas');
    }

    const igBidangRows = infoRows.flatMap(r => r.totalBidangFreq>0 ? r.bidangBreakdown.map(bb => ({nama:r.nama, ...bb})) : []);
    if(igBidangRows.length){
      let aoaIGB = [['INFO GRAFIS — REKAP BIDANG BK'],[]];
      aoaIGB.push(['Nama Personal BK','Bidang BK','Frekuensi','Prosentase']);
      igBidangRows.forEach(bb=> aoaIGB.push([bb.nama, bb.bidang, bb.frekuensi, bb.persen+'%']));
      const wsIGB = XLSX.utils.aoa_to_sheet(aoaIGB);
      wsIGB['!cols'] = [{wch:28},{wch:16},{wch:12},{wch:12}];
      XLSX.utils.book_append_sheet(wb, wsIGB, 'IG Bidang BK');
    }
  }

  addSheet('Layanan BK', ['No','Nama Siswa','Nomor Induk','Kelas','Tanggal','Layanan BK','Bidang BK','Guru BK','Hasil Layanan BK'], layananRows,
    (r,i)=>[i+1, r.nama, r.induk, r.kelas, fmtDateID(r.tgl), r.jenis, r.bidang, r.guru, r.hasil]);
  addSheet('Permasalahan Siswa', ['No','Nama Siswa','Nomor Induk','Kelas','Tanggal','Nama Kasus','Bidang BK','Kronologis','Penanganan','Kolaborasi'], kasusRows,
    (r,i)=>[i+1, r.nama, r.induk, r.kelas, fmtDateID(r.tgl), r.namaKasus, r.bidang, r.kronologis, r.penanganan, r.kolaborasi]);
  addSheet('Rekap Bidang BK', ['No','Bidang BK','Frekuensi','Persentase'], bidangRekap.rows,
    (r,i)=>[i+1, r.bidang, r.frekuensi, r.persen+'%']);
  addSheet('Layanan Klasikal BK', ['No','Kelas','Tanggal','Jam ke-','Pertemuan ke-','Materi Layanan','Guru BK'], klasikalRows,
    (r,i)=>[i+1, r.kelas, fmtDateID(r.tgl), r.jamKe, r.pertemuanKe, r.materi, r.guru]);
  addSheet('Home Visit', ['No','Tanggal','Nomor Induk','Nama Siswa','Kelas','Catatan Singkat','Bersama Wali Kelas'], hvRows,
    (r,i)=>[i+1, fmtDateID(r.tgl), r.induk, r.nama, r.kelas, r.catatan, r.waliKelas]);
  addSheet('Administrasi BK', ['No','Tanggal','Guru BK','Kategori','Kegiatan','Keterangan'], admRows,
    (r,i)=>[i+1, fmtDateID(r.tgl), r.guru, r.kategori, r.item, r.keterangan]);
  addSheet('Wawancara Wali Murid', ['No','Tanggal','Terjadwal Hari Ini','Yang Terlayani','Catatan Penting'], wwRows,
    (r,i)=>[i+1, fmtDateID(r.tgl), r.terjadwal, r.terlayani, r.catatan]);
  addSheet('Upgrading Personal BK', ['No','Awal Pelaksanaan','Akhir Pelaksanaan','Jenis Kegiatan','Judul/Tema Kegiatan','Penyelenggara','Pembicara','Catatan Penting'], upRows,
    (r,i)=>[i+1, fmtDateID(r.tglMulai), fmtDateID(r.tglSelesai), r.jenis, r.judul, r.penyelenggara, r.pembicara, r.catatan]);

  XLSX.writeFile(wb, `Laporan_Kinerja_BK_Lengkap_${todayISO()}.xlsx`);
  toast('Laporan gabungan (Excel) diunduh');
}

/* ================== HALAMAN KELOLA DATA ================== */
function computeRingkasanData(){
  const assignedKelasKelola = assignedKelasList();
  const studentsAssigned = DB.students.filter(s=>assignedKelasKelola.includes(s.kelas));
  const totalLayanan = studentsAssigned.reduce((a,s)=>a+((DB.layanan[s.induk]||[]).length),0);
  const totalKasus = studentsAssigned.reduce((a,s)=>a+((DB.kasus[s.induk]||[]).length),0);
  const totalKlasikal = assignedKelasKelola.reduce((a,k)=>a+((DB.klasikal[k]||[]).length),0);
  const totalAdministrasi = (DB.administrasi||[]).length;
  const totalWawancara = (DB.wawancaraWali||[]).length;
  const totalUpgrading = (DB.upgrading||[]).length;
  const totalHomeVisit = (DB.homeVisit||[]).filter(r=>assignedKelasKelola.includes(r.kelas)).length;
  const totalPersonalBK = (DB.personalBK||[]).length;
  return { jumlahSiswa: studentsAssigned.length, totalLayanan, totalKasus, totalKlasikal, totalAdministrasi, totalWawancara, totalUpgrading, totalHomeVisit, totalPersonalBK };
}

function computeUnservedStudents(){
  const assignedKelasKelola = assignedKelasList();
  return DB.students
    .filter(s => assignedKelasKelola.includes(s.kelas))
    .filter(s => (DB.layanan[s.induk]||[]).length === 0)
    .sort((a,b)=> a.kelas.localeCompare(b.kelas) || a.nama.localeCompare(b.nama));
}

function buildUnservedControlsHtml(){
  const assignedKelasKelola = assignedKelasList();
  return `
    <div class="searchbar" style="margin-bottom:10px;">
      <input type="text" id="unservedSearchQ" placeholder="Cari nama atau nomor induk&hellip;" value="${esc(STATE.unservedSearchQ||'')}">
      <select id="unservedFilterKelas">
        <option value="">Semua Kelas</option>
        ${assignedKelasKelola.map(k=>`<option value="${k}" ${STATE.unservedFilterKelas===k?'selected':''}>${k}</option>`).join('')}
      </select>
      <div class="btnrow" style="margin:0;">
        <button class="btn btn-ghost btn-sm" onclick="expandAllUnserved()">&#9660; Buka Semua Kelas</button>
        <button class="btn btn-ghost btn-sm" onclick="collapseAllUnserved()">&#9650; Tutup Semua Kelas</button>
        <button class="btn btn-outline btn-sm" onclick="exportUnservedExcel()">&#11015; Cetak Excel</button>
        <button class="btn btn-outline btn-sm" onclick="exportUnservedPDF()">&#11015; Cetak PDF</button>
      </div>
    </div>
  `;
}

function collectUnservedFilteredRows(){
  let rows = computeUnservedStudents();
  if(STATE.unservedFilterKelas) rows = rows.filter(s=>s.kelas===STATE.unservedFilterKelas);
  if(STATE.unservedSearchQ){
    const q = STATE.unservedSearchQ.toLowerCase();
    rows = rows.filter(s => s.nama.toLowerCase().includes(q) || String(s.induk).includes(q));
  }
  return rows;
}

function exportUnservedExcel(){
  const rows = collectUnservedFilteredRows();
  if(!rows.length){ toast('Tidak ada data untuk dicetak', true); return; }
  const wb = XLSX.utils.book_new();
  const aoa = [['SISWA BELUM TERKONSELING — SMP AL HIKMAH SURABAYA'], [laporanTahunAjaranLabel() + '  |  ' + laporanPersonalBKLabel()], []];
  aoa.push(['No','Nama Siswa','Nomor Induk','Kelas']);
  rows.forEach((s,i)=> aoa.push([i+1, s.nama, s.induk, s.kelas]));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:5},{wch:30},{wch:14},{wch:10}];
  XLSX.utils.book_append_sheet(wb, ws, 'Siswa Belum Terkonseling');
  XLSX.writeFile(wb, `Siswa_Belum_Terkonseling_${todayISO()}.xlsx`);
  toast('Berkas Excel diunduh');
}

function exportUnservedPDF(){
  const rows = collectUnservedFilteredRows();
  if(!rows.length){ toast('Tidak ada data untuk dicetak', true); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'p', unit:'pt', format:'a4'});
  const y = pdfHeader(doc, 'Siswa Belum Terkonseling - SMP Al Hikmah Surabaya', laporanTahunAjaranLabel() + '  |  ' + laporanPersonalBKLabel());
  doc.autoTable({
    head:[['No','Nama Siswa','Nomor Induk','Kelas']],
    body: rows.map((s,i)=>[i+1, s.nama, s.induk, s.kelas]),
    startY: y+8, styles:{fontSize:9, cellPadding:5, valign:'top'},
    headStyles:{fillColor:[13,59,54], textColor:255},
    margin:{left:40,right:40}
  });
  doc.save(`Siswa_Belum_Terkonseling_${todayISO()}.pdf`);
  toast('Berkas PDF diunduh');
}

function buildUnservedStudentsHtml(){
  const assignedKelasKelola = assignedKelasList();
  const totalAssigned = DB.students.filter(s=>assignedKelasKelola.includes(s.kelas)).length;
  if(!totalAssigned){
    return `<div class="empty">Belum ada data siswa di kelas yang Anda tugaskan.</div>`;
  }
  const allUnserved = computeUnservedStudents();
  if(!allUnserved.length){
    return `<div class="empty" style="border-style:solid;background:#e9f6f0;">&#127881; Semua ${totalAssigned} siswa di kelas yang Anda tugaskan sudah pernah mendapat Layanan BK.</div>`;
  }
  return buildUnservedControlsHtml() + `<div id="unservedResultsList">${buildUnservedResultsHtml()}</div>`;
}

function buildUnservedResultsHtml(){
  const assignedKelasKelola = assignedKelasList();
  const totalAssigned = DB.students.filter(s=>assignedKelasKelola.includes(s.kelas)).length;
  const allUnserved = computeUnservedStudents();

  let rows = allUnserved;
  if(STATE.unservedFilterKelas) rows = rows.filter(s=>s.kelas===STATE.unservedFilterKelas);
  if(STATE.unservedSearchQ){
    const q = STATE.unservedSearchQ.toLowerCase();
    rows = rows.filter(s => s.nama.toLowerCase().includes(q) || String(s.induk).includes(q));
  }

  const summary = `<div class="footer-note" style="margin-bottom:10px;">${allUnserved.length} dari ${totalAssigned} siswa belum pernah mendapat Layanan BK.</div>`;

  if(!rows.length){
    return summary + `<div class="empty">Tidak ada siswa yang cocok dengan pencarian/filter ini.</div>`;
  }

  // Kelompokkan per kelas agar tetap ringkas meski jumlahnya ratusan siswa
  const groups = {};
  rows.forEach(s=>{ (groups[s.kelas] = groups[s.kelas] || []).push(s); });
  const kelasKeys = Object.keys(groups).sort();

  const groupsHtml = kelasKeys.map(kelas=>{
    const members = groups[kelas];
    const expanded = !!STATE.unservedExpandedClasses[kelas];
    return `
      <div class="record" style="margin-bottom:8px;">
        <div class="rtop" style="cursor:pointer;" onclick="toggleUnservedClass('${kelas}')">
          <div class="tag">Kelas ${esc(kelas)} <span class="pill pill-gold" style="margin-left:6px;">${members.length} siswa</span></div>
          <span style="font-size:13px;color:var(--teal-700);">${expanded ? '&#9650; Tutup' : '&#9660; Buka'}</span>
        </div>
        ${expanded ? `
        <div style="overflow-x:auto;margin-top:8px;">
        <table class="list">
          <thead><tr><th>Nama</th><th>Induk</th><th>Aksi</th></tr></thead>
          <tbody>
            ${members.map(s=>`<tr>
              <td class="namecell">${esc(s.nama)}</td>
              <td>${esc(s.induk)}</td>
              <td><button class="btn btn-primary btn-sm" onclick="goSiswa('${esc(s.induk)}','layanan')">Layanan BK</button></td>
            </tr>`).join('')}
          </tbody>
        </table>
        </div>` : ''}
      </div>
    `;
  }).join('');

  return summary + groupsHtml;
}

function toggleUnservedClass(kelas){
  STATE.unservedExpandedClasses[kelas] = !STATE.unservedExpandedClasses[kelas];
  updateUnservedSection();
}
function expandAllUnserved(){
  computeUnservedStudents().forEach(s=>{ STATE.unservedExpandedClasses[s.kelas] = true; });
  updateUnservedSection();
}
function collapseAllUnserved(){
  STATE.unservedExpandedClasses = {};
  updateUnservedSection();
}
function updateUnservedSection(){
  const el = document.getElementById('unservedResultsList');
  if(el) el.innerHTML = buildUnservedResultsHtml();
}

async function startNewAcademicYear(){
  if(!isCurrentUserAdminBK()){
    toast('Tindakan ini hanya bisa dilakukan oleh Admin BK', true);
    return;
  }
  const newTahun = (document.getElementById('arsipTahunBaruInput').value||'').trim();
  if(!newTahun){ toast('Isi Tahun Ajaran baru terlebih dahulu', true); return; }
  const currentTahun = DB.settings.tahunAjaran || 'Tanpa Nama';

  const ok = await confirmModal(
    'Mulai Tahun Ajaran Baru',
    `Data transaksional (Layanan BK, Permasalahan Siswa, Layanan Klasikal BK, Home Visit, Administrasi BK, Wawancara Wali Murid, dan Upgrading Personal BK) akan diarsipkan otomatis sebagai berkas cadangan lalu direset kosong untuk tahun ajaran <b>${esc(newTahun)}</b>. Data Siswa dan Personal BK (termasuk kelas yang ditugaskan) TIDAK akan dihapus. Tindakan ini tidak dapat dibatalkan setelah dijalankan. Lanjutkan?`,
    'Ya, Arsipkan & Mulai Baru', true
  );
  if(!ok) return;

  await ensureAllLoaded();

  // 1. Unduh arsip cadangan tahun ajaran berjalan (sebelum direset)
  const backup = { tahunAjaran: currentTahun, students: DB.students, layanan: DB.layanan, kasus: DB.kasus, klasikal: DB.klasikal, administrasi: DB.administrasi, wawancaraWali: DB.wawancaraWali, upgrading: DB.upgrading, homeVisit: DB.homeVisit, personalBK: DB.personalBK, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(backup,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeNama = String(currentTahun).replace(/[^a-zA-Z0-9]+/g,'_');
  a.href = url; a.download = `Arsip_Tahun_Ajaran_${safeNama}_${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);

  // 2. Hapus data transaksional per-siswa & per-kelas dari penyimpanan
  for(const s of DB.students){
    await sDel('layanan_'+s.induk);
    await sDel('kasus_'+s.induk);
  }
  for(const k of KELAS_LIST){
    await sDel('klasikal_'+k);
  }

  // 3. Reset data transaksional di memori & penyimpanan (data siswa & Personal BK TIDAK disentuh)
  DB.layanan = {};
  DB.kasus = {};
  DB.klasikal = {};
  DB.administrasi = [];
  DB.wawancaraWali = [];
  DB.upgrading = [];
  DB.homeVisit = [];
  await sSet('administrasi', []);
  await sSet('wawancara_wali_7', []);
  await sSet('upgrading_personal_bk', []);
  await sSet('home_visit', []);

  // 4. Perbarui Tahun Ajaran
  DB.settings.tahunAjaran = newTahun;
  await sSet('settings', DB.settings);

  await logActivity(`Menjalankan "Mulai Tahun Ajaran Baru" (${esc(currentTahun)} &rarr; ${esc(newTahun)})`);
  toast(`Tahun ajaran ${newTahun} dimulai. Arsip data lama sudah diunduh.`);
  render();
}

function simpleHash(str){
  let hash = 5381;
  for(let i=0;i<str.length;i++){
    hash = ((hash << 5) + hash) + str.charCodeAt(i);
    hash = hash & hash;
  }
  return (hash >>> 0).toString(16);
}

function computeMonthlyTrend(monthsBack){
  monthsBack = monthsBack || 6;
  const now = new Date();
  const months = [];
  for(let i=monthsBack-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    const label = d.toLocaleDateString('id-ID',{month:'short',year:'2-digit'});
    months.push({ key, label, layanan:0, kasus:0, klasikal:0, homeVisit:0 });
  }
  const findMonth = (tgl) => {
    if(!tgl || tgl.length<7) return null;
    const key = tgl.slice(0,7);
    return months.find(m=>m.key===key) || null;
  };
  Object.values(DB.layanan||{}).forEach(recs=>{
    (recs||[]).forEach(r=>{ const m = findMonth(r.tgl); if(m) m.layanan++; });
  });
  Object.values(DB.kasus||{}).forEach(recs=>{
    (recs||[]).forEach(r=>{ const m = findMonth(r.tgl); if(m) m.kasus++; });
  });
  Object.values(DB.klasikal||{}).forEach(recs=>{
    (recs||[]).forEach(r=>{ const m = findMonth(r.tgl); if(m) m.klasikal++; });
  });
  (DB.homeVisit||[]).forEach(r=>{ const m = findMonth(r.tgl); if(m) m.homeVisit++; });
  return months;
}

function buildMonthlyTrendChartHtml(){
  const data = computeMonthlyTrend(6);
  const maxTotal = Math.max(1, ...data.map(d=>d.layanan+d.kasus+d.klasikal+d.homeVisit));
  const chartH = 180;
  const totalAll = data.reduce((a,d)=>a+d.layanan+d.kasus+d.klasikal+d.homeVisit, 0);
  if(totalAll===0){
    return `<div class="empty">Belum ada data dengan tanggal tercatat pada 6 bulan terakhir.</div>`;
  }
  return `
    <div style="display:flex;align-items:flex-end;gap:14px;height:${chartH}px;padding-top:22px;">
      ${data.map(d=>{
        const total = d.layanan+d.kasus+d.klasikal+d.homeVisit;
        const barPx = total>0 ? Math.max(6, Math.round(total/maxTotal*chartH)) : 2;
        const segPct = (v)=> total>0 ? (v/total*100) : 0;
        return `
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;">
          <div style="font-size:11px;font-weight:700;color:var(--teal-900);margin-bottom:4px;min-height:14px;">${total||''}</div>
          <div style="width:100%;max-width:44px;height:${barPx}px;display:flex;flex-direction:column-reverse;border-radius:5px 5px 2px 2px;overflow:hidden;background:var(--teal-50);border:1px solid var(--line);">
            ${d.layanan>0?`<div style="height:${segPct(d.layanan)}%;background:var(--teal-700);" title="Layanan BK: ${d.layanan}"></div>`:''}
            ${d.kasus>0?`<div style="height:${segPct(d.kasus)}%;background:var(--danger);" title="Permasalahan: ${d.kasus}"></div>`:''}
            ${d.klasikal>0?`<div style="height:${segPct(d.klasikal)}%;background:var(--gold-600);" title="Klasikal: ${d.klasikal}"></div>`:''}
            ${d.homeVisit>0?`<div style="height:${segPct(d.homeVisit)}%;background:var(--teal-950);" title="Home Visit: ${d.homeVisit}"></div>`:''}
          </div>
        </div>`;
      }).join('')}
    </div>
    <div style="display:flex;gap:14px;margin-top:6px;">
      ${data.map(d=>`<div style="flex:1;text-align:center;font-size:11px;color:var(--ink-soft);">${esc(d.label)}</div>`).join('')}
    </div>
  `;
}

function generatePersonalBKInsights(row, allRows){
  const strengths = [];
  const weaknesses = [];
  if(!row.assignedKelas.length){
    weaknesses.push('Belum ada kelas yang ditugaskan pada Personal BK ini');
    return { strengths: ['-'], weaknesses };
  }
  const categories = [
    {key:'layanan', label:'Layanan BK'},
    {key:'kasus', label:'penanganan Permasalahan Siswa'},
    {key:'klasikal', label:'Layanan Klasikal BK'},
    {key:'homeVisit', label:'Home Visit'},
    {key:'administrasiCount', label:'Administrasi BK'}
  ];
  categories.forEach(cat=>{
    const values = allRows.map(r=>r[cat.key]);
    const max = Math.max(...values);
    if(max>0 && row[cat.key]===max){
      strengths.push(`Tertinggi dalam ${cat.label} (${row[cat.key]})`);
    }
  });
  const avgTotal = allRows.reduce((a,r)=>a+r.total,0) / allRows.length;
  if(row.total < avgTotal*0.5){
    weaknesses.push(`Total aktivitas layanan tercatat (${row.total}) jauh di bawah rata-rata tim (${avgTotal.toFixed(1)})`);
  }
  if(row.hasJumlahSiswaData && row.persenTerlayaniTotal!==null && row.persenTerlayaniTotal < 30){
    weaknesses.push(`Baru menjangkau ${row.persenTerlayaniTotal}% siswa di kelas tugasnya dengan Layanan BK`);
  }
  if(!row.hasJumlahSiswaData){
    weaknesses.push('Belum mengisi "Jumlah Siswa di Kelas" sehingga persentase capaian belum dapat dihitung');
  }
  if(strengths.length===0 && row.total>0) strengths.push('Aktivitas layanan tercatat merata, tidak menonjol di satu kategori tertentu');
  if(strengths.length===0 && row.total===0) strengths.push('-');
  if(weaknesses.length===0) weaknesses.push('Tidak ada catatan kekurangan signifikan berdasarkan data yang tercatat');
  return { strengths, weaknesses };
}
